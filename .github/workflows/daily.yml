name: Japanese stock daily report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/theme.css'
      - 'requirements.txt'
  schedule:
    # 21:17/21:47 UTC = 06:17/06:47 JST the following day.
    # The second run retries generation/publication if the first run fails.
    # GitHub may delay schedules; publication by 07:00 is not guaranteed.
    - cron: '17 21 * * *'
    - cron: '47 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Test site renderer
        run: python -m unittest discover -s tests -v
      - name: Reconstruct requested historical editions
        run: python scripts/backfill.py
      - name: Check today's report
        id: report
        if: github.event_name != 'push'
        run: |
          report_date=$(TZ=Asia/Tokyo date +%F)
          echo "date=$report_date" >> "$GITHUB_OUTPUT"
          if [ -s "reports/$report_date.md" ] && head -n 1 "reports/$report_date.md" | grep -Fq "$report_date"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate report
        if: github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || steps.report.outputs.exists != 'true')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          REPORT_DATE: ${{ steps.report.outputs.date }}
        run: python scripts/daily_report.py
      - name: Build bilingual STOCK NEWS site
        run: python scripts/build_site.py
      - name: Verify today's report and website
        if: github.event_name != 'push'
        env:
          REPORT_DATE: ${{ steps.report.outputs.date }}
        run: |
          test -s "reports/$REPORT_DATE.md"
          head -n 1 "reports/$REPORT_DATE.md" | grep -Fq "$REPORT_DATE"
          test -s "docs/reports/$REPORT_DATE.html"
          test -s "docs/summary/$REPORT_DATE.html"
          grep -Fq "$REPORT_DATE" docs/index.html
          echo "Verified report and website for $REPORT_DATE (JST)." >> "$GITHUB_STEP_SUMMARY"
      - name: Save reports and selection history to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports docs data/history.json data/translations_en.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily stock report $(TZ=Asia/Tokyo date +%F)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git pull --rebase -X ours origin main
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Explain failed update
        if: failure()
        run: |
          echo "::error::Daily stock update failed. Check the failed step; the next scheduled run can retry."
          echo "### Daily stock update failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step above. Backup schedule: 06:47 JST. Manual retry: Run workflow." >> "$GITHUB_STEP_SUMMARY"
