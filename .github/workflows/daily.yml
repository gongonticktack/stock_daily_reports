name: Japanese stock daily report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/theme.css'
      - 'requirements.txt'
  schedule:
    # 22:00 UTC = 07:00 JST the following day (JST has no DST).
    # GitHub Actions schedules may be delayed; exact 07:00 delivery is NOT guaranteed.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Test site renderer
        run: python -m unittest discover -s tests -v
      - name: Generate report
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/daily_report.py
      - name: Build bilingual STOCK NEWS site
        run: python scripts/build_site.py
      - name: Save reports and selection history to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports docs data/history.json data/translations_en.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily stock report $(TZ=Asia/Tokyo date +%F)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git pull --rebase -X ours origin main
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4